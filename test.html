<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test</title></head>
<body style="font-family:Arial;padding:16px">
<h3>Test conexiune</h3>
<button id="b" style="padding:14px 20px;font-size:18px">Trimite test</button>
<pre id="o" style="white-space:pre-wrap;word-break:break-word;margin-top:16px">Apasă butonul.</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
const o=document.getElementById('o');
o.textContent='supabase încărcat: '+(!!window.supabase)+'\nurl: '+(window.DANIEL_CONFIG&&window.DANIEL_CONFIG.url);
document.getElementById('b').onclick=async()=>{
  try{
    const c=window.supabase.createClient(DANIEL_CONFIG.url,DANIEL_CONFIG.anonKey);
    const r=await c.from('rsvps').insert({first_name:'Test',last_name:'Test',attending:true,adults:1,children:0,note:''});
    o.textContent='status: '+r.status+'\n'+JSON.stringify(r.error,null,2);
  }catch(e){o.textContent='EROARE: '+e.message}
};
</script></body></html>
